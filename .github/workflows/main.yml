name: Build and Deploy To EC2

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/stylist-ai-client:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/stylist-ai-client:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            docker pull ${{ secrets.DOCKER_USERNAME }}/stylist-ai-client:${{ github.sha }}

            docker stop stylist-ai-client || true
            docker rm stylist-ai-client || true
            docker image prune -af || true

            docker run -d \
            --name stylist-ai-client \
            --env-file /home/ubuntu/stylist-ai/stylist-ai-client/.env \
            -v /home/ubuntu/stylist-ai/stylist-ai-client/.env:/app/.env:ro \
            -p 3001:3001 \
            ${{ secrets.DOCKER_USERNAME }}/stylist-ai-client:${{ github.sha }}
